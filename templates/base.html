{% load static %}
<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>{% block title %}CampusHire{% endblock %}</title><link rel="stylesheet" href="{% static 'style.css' %}"></head><body>{% if messages %}<div class="toast-stack">{% for message in messages %}<div class="site-message {{ message.tags }}">{{ message }}</div>{% endfor %}</div>{% endif %}{% block content %}{% endblock %}<script>setTimeout(()=>document.querySelectorAll('.site-message').forEach(x=>x.remove()),6000)</script></body></html>
