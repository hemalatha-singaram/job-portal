{% extends "base.html" %}
{% block title %}Verify Code | CampusHire{% endblock %}
{% block content %}
<div class="auth-page"><div class="auth-card-modern">
<div class="auth-icon">✓</div><div class="eyebrow">VERIFY EMAIL</div><h1>Enter your code</h1><p class="auth-subtitle">We sent a 6-digit verification code to <strong>{{ email }}</strong>. The code is valid for 10 minutes.</p>
<form method="post" class="auth-form">{% csrf_token %}<label>Verification code</label><input class="otp-input" type="text" name="code" inputmode="numeric" maxlength="6" pattern="[0-9]{6}" placeholder="000000" required autofocus>
<button class="primary-btn" type="submit">Verify code <span>→</span></button></form>
<p class="auth-switch"><a href="{% url 'forgot_password' %}?role={{ role }}">Request a new code</a></p>
</div></div>
{% endblock %}
