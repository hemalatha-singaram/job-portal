{% extends 'base.html' %}

{% block title %}Recruiter Register{% endblock %}

{% block content %}
<div class="auth-shell">
    <div class="auth-card">
        <p class="section-kicker text-primary">Recruiter account</p>
        <h2 class="fw-bold mb-3">Create your recruiter login</h2>
        <form method="POST">
            {% csrf_token %}
            <div class="row g-3">
                <div class="col-md-6">
                    <label class="form-label">First name</label>
                    <input type="text" name="first_name" class="form-control">
                </div>
                <div class="col-md-6">
                    <label class="form-label">Last name</label>
                    <input type="text" name="last_name" class="form-control">
                </div>
                <div class="col-12">
                    <label class="form-label">Username</label>
                    <input type="text" name="username" class="form-control" required>
                </div>
                <div class="col-12">
                    <label class="form-label">Email</label>
                    <input type="email" name="email" class="form-control">
                </div>
                <div class="col-12">
                    <label class="form-label">Password</label>
                    <input type="password" name="password" class="form-control" required>
                </div>
            </div>
            <button type="submit" class="btn btn-primary w-100 mt-3">Register</button>
        </form>
        <p class="text-center mt-3 mb-0">Already registered? <a href="{% url 'recruiter_login' %}">Login</a></p>
    </div>
</div>
{% endblock %}
