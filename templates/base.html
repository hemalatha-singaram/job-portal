{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}CampusHire{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'style.css' %}">
</head>
<body>
<nav class="topbar">
    <div class="container d-flex align-items-center justify-content-between gap-3">
        <a class="brand-mark" href="{% url 'home' %}">CampusHire</a>
        <div class="top-nav-links">
            <a href="{% url 'home' %}" class="nav-pill">Home</a>
            <a href="{% url 'candidate_jobs' %}" class="nav-pill">Jobs</a>
            <a href="{% url 'candidate_login' %}" class="nav-pill">Student Login</a>
            <a href="{% url 'recruiter_login' %}" class="nav-pill nav-pill-primary">Recruiter Login</a>
        </div>
    </div>
</nav>

{% if messages %}
<div class="container mt-3">
    {% for message in messages %}
    <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
        {{ message }}
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    {% endfor %}
</div>
{% endif %}

{% block content %}{% endblock %}

<footer class="site-footer">
    <div class="container d-flex flex-column flex-md-row justify-content-between gap-2">
        <span>CampusHire</span>
        <span>Students apply · Recruiters hire</span>
    </div>
</footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
