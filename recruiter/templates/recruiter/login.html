{% extends "base.html" %}
{% block title %}Recruiter Login | CampusHire{% endblock %}
{% block content %}
<div class="auth-page"><div class="auth-card-modern">
<div class="role-label">RECRUITER PORTAL</div><h1>Welcome back.</h1><p class="auth-subtitle">Sign in to your CampusHire account.</p>
<form method="post" class="auth-form">{% csrf_token %}
<label>Username</label><input type="text" name="username" placeholder="Enter your username" required autofocus>
<label>Password</label><input type="password" name="password" placeholder="Enter your password" required>
<div class="form-row-between"><label class="remember"><input type="checkbox"> Remember me</label><a href="{% url 'forgot_password' %}?role=recruiter">Forgot password?</a></div>
<button class="primary-btn" type="submit">Sign in <span>→</span></button></form>
<div class="divider"><span>New to CampusHire?</span></div><a class="secondary-btn" href="{% url 'recruiter_register' %}">Create recruiter account</a>
<p class="auth-switch"><a href="{% url 'home' %}">← Back to CampusHire</a></p>
</div></div>
{% endblock %}
