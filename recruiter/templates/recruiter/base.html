{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>{% block title %}Recruiter{% endblock %}</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

<style>

body{
    background:#f4f7fb;
    font-family:Arial, Helvetica, sans-serif;
}

.sidebar{

    width:240px;

    height:100vh;

    position:fixed;

    left:0;

    top:0;

    background:#1E3A8A;

    color:white;

    padding-top:20px;
}

.logo{

    text-align:center;

    font-size:24px;

    font-weight:bold;

    margin-bottom:40px;
}

.sidebar a{

    display:block;

    color:white;

    text-decoration:none;

    padding:15px 25px;

    transition:.3s;
}

.sidebar a:hover{

    background:#2563EB;

}

.main{

    margin-left:240px;

    padding:30px;
}

.topbar{

    background:white;

    padding:18px;

    border-radius:12px;

    box-shadow:0 3px 10px rgba(0,0,0,.08);

    margin-bottom:30px;
}

.card{

    border:none;

    border-radius:15px;

    box-shadow:0 5px 15px rgba(0,0,0,.1);

}

</style>

</head>

<body>
<div class="sidebar">

<div class="logo">

<h2>TalentSphere</h2>

<hr style="background:white;">

</div>

<a href="{% url 'dashboard' %}">
🏠 Dashboard
</a>

<a href="{% url 'post_job' %}">
➕ Post Job
</a>

<a href="{% url 'view_jobs' %}">
💼 My Jobs
</a>

<a href="{% url 'profile' %}">
👤 Profile
</a>

<a href="/admin/">
⚙ Admin
</a>

</div>

</div>

<div class="main">

<div class="topbar">

<h3 class="mb-0">
Recruiter Portal
</h3>

</div>

{% block content %}

{% endblock %}

</div>

</body>

</html>
