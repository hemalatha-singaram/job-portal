{% extends 'base.html' %}

{% block title %}Student Register{% endblock %}

{% block content %}
<div class="auth-shell">
    <div class="auth-card">
        <p class="section-kicker text-primary">Student account</p>
        <h2 class="fw-bold mb-3">Create your student login</h2>
        <form method="POST">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn-primary w-100">Register</button>
        </form>
        <p class="text-center mt-3 mb-0">Already registered? <a href="{% url 'candidate_login' %}">Login</a></p>
    </div>
</div>
{% endblock %}
