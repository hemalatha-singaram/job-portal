{% extends 'base.html' %}

{% block title %}Recruiter Login{% endblock %}

{% block content %}
<div class="auth-shell">
    <div class="auth-card">
        <p class="section-kicker text-primary">Recruiter panel</p>
        <h2 class="fw-bold mb-3">Login to post jobs</h2>
        <form method="POST">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label">Username</label>
                <input type="text" name="username" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Password</label>
                <input type="password" name="password" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-primary w-100">Login</button>
        </form>
        <p class="text-center mt-3 mb-0">New recruiter? <a href="{% url 'recruiter_register' %}">Create account</a></p>
    </div>
</div>
{% endblock %}
