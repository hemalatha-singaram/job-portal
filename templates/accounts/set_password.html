{% extends "base.html" %}
{% block title %}Create New Password | CampusHire{% endblock %}
{% block content %}
<div class="auth-page"><div class="auth-card-modern">
<div class="auth-icon">🔒</div><div class="eyebrow">SECURE YOUR ACCOUNT</div><h1>Create a new password</h1><p class="auth-subtitle">Choose a strong password for <strong>{{ email }}</strong>.</p>
<form method="post" class="auth-form">{% csrf_token %}<label>New password</label><input type="password" name="password" minlength="8" required><label>Confirm password</label><input type="password" name="confirm_password" minlength="8" required><button class="primary-btn" type="submit">Update password <span>→</span></button></form>
</div></div>
{% endblock %}
